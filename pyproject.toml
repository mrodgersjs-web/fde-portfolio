[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-portfolio"
version = "0.2.0"
description = "Structured Forward Deployed Engineering playbook data plus a CLI that renders project checklists."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mike Rodgers" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/fde-portfolio"
Repository = "https://github.com/mrodgersjs-web/fde-portfolio"
Issues = "https://github.com/mrodgersjs-web/fde-portfolio/issues"

[project.scripts]
fde-portfolio = "fde_portfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fde_portfolio = ["py.typed", "schemas/*.json", "playbooks/*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["mcp", ".rig"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

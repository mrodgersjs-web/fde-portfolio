<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#C8A96E;letter-spacing:3px;text-transform:uppercase}
      .title{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:27px;fill:#F5F0EB}
      .label{font-family:'Hanken Grotesk','Helvetica Neue',sans-serif;font-size:14px;fill:#F5F0EB;letter-spacing:1px}
      .bullet{font-family:'Hanken Grotesk','Helvetica Neue',sans-serif;font-size:11px;fill:#A09890}
      .mono-gold{font-family:'JetBrains Mono','SF Mono',monospace;font-size:10px;fill:#C8A96E;letter-spacing:1px}
      .caption{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#635D57;letter-spacing:2px;text-transform:uppercase}
    </style>
    <linearGradient id="goldFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C8A96E" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.4"/><stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#181310" stop-opacity="1"/><stop offset="100%" stop-color="#0A0806" stop-opacity="1"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C8A96E"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#ambient)"/>

  <text x="60" y="42" class="kicker">FDE PORTFOLIO</text>
  <text x="60" y="72" class="title">From first call to full handoff</text>

  <!-- spine -->
  <path d="M180,150 H1020" stroke="url(#goldFade)" stroke-width="2"/>

  <!-- stage nodes + cards -->
  <!-- 1 Discovery -->
  <g transform="translate(180,150)">
    <circle r="40" fill="url(#glow)" opacity="0.4"/>
    <circle r="26" fill="#141210" stroke="#C8A96E" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#C8A96E">01</text>
    <text y="-46" text-anchor="middle" class="label">Discovery</text>
  </g>
  <rect x="80" y="200" width="200" height="120" rx="8" fill="#141210" stroke="#A09890" stroke-width="1.2" opacity="0.5"/>
  <text x="180" y="226" text-anchor="middle" class="mono-gold">DELIVERABLES</text>
  <text x="100" y="252" class="bullet">— stakeholder map</text>
  <text x="100" y="270" class="bullet">— data audit</text>
  <text x="100" y="288" class="bullet">— success metrics</text>

  <!-- 2 Pilot -->
  <path d="M206,150 H354" stroke="url(#goldFade)" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(390,150)">
    <circle r="40" fill="url(#glow)" opacity="0.4"/>
    <circle r="26" fill="#141210" stroke="#C8A96E" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#C8A96E">02</text>
    <text y="-46" text-anchor="middle" class="label">Pilot</text>
  </g>
  <rect x="290" y="200" width="200" height="120" rx="8" fill="#141210" stroke="#A09890" stroke-width="1.2" opacity="0.5"/>
  <text x="390" y="226" text-anchor="middle" class="mono-gold">DELIVERABLES</text>
  <text x="310" y="252" class="bullet">— working prototype</text>
  <text x="310" y="270" class="bullet">— live data connection</text>
  <text x="310" y="288" class="bullet">— go/no-go review</text>

  <!-- 3 Production -->
  <path d="M416,150 H564" stroke="url(#goldFade)" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(600,150)">
    <circle r="46" fill="url(#glow)" opacity="0.65"/>
    <circle r="30" fill="#141210" stroke="#C8A96E" stroke-width="2.4"/>
    <text y="5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14" fill="#C8A96E">03</text>
    <text y="-52" text-anchor="middle" class="label">Production</text>
  </g>
  <rect x="490" y="200" width="220" height="120" rx="8" fill="#141210" stroke="#C8A96E" stroke-width="1.6" opacity="0.7"/>
  <text x="600" y="226" text-anchor="middle" class="mono-gold">DELIVERABLES</text>
  <text x="510" y="252" class="bullet">— hardened deployment</text>
  <text x="510" y="270" class="bullet">— monitoring + alerts</text>
  <text x="510" y="288" class="bullet">— runbook</text>

  <!-- 4 Handoff -->
  <path d="M646,150 H794" stroke="url(#goldFade)" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(830,150)">
    <circle r="40" fill="url(#glow)" opacity="0.4"/>
    <circle r="26" fill="#141210" stroke="#C8A96E" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#C8A96E">04</text>
    <text y="-46" text-anchor="middle" class="label">Handoff</text>
  </g>
  <rect x="730" y="200" width="200" height="120" rx="8" fill="#141210" stroke="#A09890" stroke-width="1.2" opacity="0.5"/>
  <text x="830" y="226" text-anchor="middle" class="mono-gold">DELIVERABLES</text>
  <text x="750" y="252" class="bullet">— documentation</text>
  <text x="750" y="270" class="bullet">— team enablement</text>
  <text x="750" y="288" class="bullet">— ownership transfer</text>

  <path d="M856,150 H1000" stroke="url(#goldFade)" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="60" y1="352" x2="1140" y2="352" stroke="#A09890" stroke-width="1" opacity="0.12"/>
  <text x="60" y="374" class="caption">no stage ends without a named artifact</text>
</svg>
